[project]
name = "freelance-hunter"
version = "0.1.0"
description = "Freelance opportunity discovery and qualification service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
